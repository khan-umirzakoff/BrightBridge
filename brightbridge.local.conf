# Laravel Virtual Host Configuration for Laragon
# This should be placed in Laragon's Apache sites directory

<VirtualHost *:80>
    DocumentRoot "C:/Users/khan/Desktop/BrightBridge/public_html/public"
    ServerName brightbridge.local
    ServerAlias www.brightbridge.local
    
    <Directory "C:/Users/khan/Desktop/BrightBridge/public_html/public">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
        
        # Laravel specific rewrites
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>
    
    # Error and access logs
    ErrorLog "logs/brightbridge-error.log"
    CustomLog "logs/brightbridge-access.log" combined
    
    # PHP settings for Laravel
    php_value upload_max_filesize 64M
    php_value post_max_size 64M
    php_value max_execution_time 300
    php_value max_input_vars 3000
</VirtualHost>